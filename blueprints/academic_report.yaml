name: academic_report
description: Standard IMRAD academic report format
section_order:
  - abstract
  - introduction
  - methods
  - results
  - discussion
  - conclusion
  - references
sections:
  abstract:
    section_id: abstract
    title: Abstract
    required: true
    section_type: abstract
    order: 1
  introduction:
    section_id: introduction
    title: Introduction
    required: true
    section_type: introduction
    order: 2
  methods:
    section_id: methods
    title: Methods
    required: true
    section_type: methods
    order: 3
  results:
    section_id: results
    title: Results
    required: true
    section_type: results
    order: 4
  discussion:
    section_id: discussion
    title: Discussion
    required: true
    section_type: discussion
    order: 5
  conclusion:
    section_id: conclusion
    title: Conclusion
    required: true
    section_type: conclusion
    order: 6
  references:
    section_id: references
    title: References
    required: true
    section_type: references
    order: 7
