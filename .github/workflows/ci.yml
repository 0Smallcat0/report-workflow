name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[mcp,render]

      # The render extra is installed because it is what the project tells
      # people to install — .claude-plugin/plugin.json and the README both say
      # `report-workflow[mcp,render]`, and that extra carries pandoc. Testing
      # without it measured a configuration nobody ships, and hid a real defect
      # in the python-docx fallback behind a red build nobody could read.
      # Everything below is still deterministic and offline.
      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests

      - name: Anti-hallucination gate demo
        run: python examples/anti_hallucination_gate.py

      - name: Benchmark evidence check (7 profiles)
        run: python scripts/run_report_benchmarks.py --check

      - name: Adversarial benchmark check (catch rate + determinism)
        run: python scripts/run_adversarial_benchmark.py --check

      - name: Report-quality benchmark check (harness versus unassisted)
        run: python scripts/run_report_quality_benchmark.py --check

      - name: Drone-market benchmark check (harness versus the hand-built control)
        run: python scripts/run_drone_market_benchmark.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  # The tool arm is the one benchmark document the pipeline generates, and it
  # is checked in. If the code that reaches the deliverable changes and nobody
  # re-records, every score in the drone-market archive describes a document
  # the current code would no longer produce — and `--check` cannot see that,
  # because it re-scores the checked-in file rather than regenerating it.
  #
  # So: re-record and diff. Not "the script's file hash changed" — a comment
  # or a reformat would turn that red, and what it would be measuring is
  # byte-identity of a source file rather than whether the fixture moved.
  #
  # Path-triggered, because a full re-record runs prepare, validate and render.
  # An ordinary pull request should not pay for it.
  rerecord:
    name: Tool arm still re-records to the checked-in fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What changed
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deliverable:
              - 'src/report_workflow/nodes/**'
              - 'src/report_workflow/derived_evidence.py'
              - 'src/report_workflow/blueprints/**'
              - 'scripts/record_tool_arm.py'
              - 'scripts/report_axes.py'

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.deliverable == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        if: steps.changed.outputs.deliverable == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .[mcp,render]

      - name: Re-record the tool arm
        if: steps.changed.outputs.deliverable == 'true'
        run: python scripts/record_tool_arm.py

      - name: The re-recording must match the checked-in fixture
        if: steps.changed.outputs.deliverable == 'true'
        run: |
          if ! git diff --exit-code -- benchmarks/fixtures/drone_market_tool_arm.md; then
            echo "::error::The pipeline no longer produces the recorded tool arm."
            echo "Run 'python scripts/record_tool_arm.py', review the diff, and"
            echo "re-run the blind judging if the argument changed — the archived"
            echo "scores describe the fixture, not the code."
            exit 1
          fi

  # The version lives in four files here and a fifth on PyPI, and they drift
  # independently: eleven tags once shipped while the repository advertised a
  # version from the month before, and a later release was tagged and never
  # published — so `uvx`, which is how .claude-plugin/plugin.json starts the
  # server, kept installing the previous version while testing through MCP
  # reported the fixes as not working. Its own job because it needs the tags
  # and the network, and neither belongs in the matrix above.
  version-sync:
    name: Version sync (repo, tags, PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the whole point: a shallow checkout has none, and the
          # check would pass by seeing nothing.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository, tags and PyPI must agree
        run: python scripts/check_version_sync.py --pypi
