name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Pandoc is the required DOCX renderer; preflight checks for it, so it must
      # be present for the end-to-end workflow tests (rendering itself is mocked).
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests

      - name: Anti-hallucination gate demo
        run: python examples/anti_hallucination_gate.py

      - name: Benchmark evidence check (7 profiles)
        run: python scripts/run_report_benchmarks.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests -v
