name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[mcp]

      # No external tools required: rendering is mocked and the readiness-dependent
      # workflow test is hermetic, so every check below is deterministic and offline.
      - name: Byte-compile sources and tests
        run: python -m compileall -q src tests

      - name: Anti-hallucination gate demo
        run: python examples/anti_hallucination_gate.py

      - name: Benchmark evidence check (7 profiles)
        run: python scripts/run_report_benchmarks.py --check

      - name: Adversarial benchmark check (catch rate + determinism)
        run: python scripts/run_adversarial_benchmark.py --check

      - name: Report-quality benchmark check (harness versus unassisted)
        run: python scripts/run_report_quality_benchmark.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests -v

  # The version lives in four files here and a fifth on PyPI, and they drift
  # independently: eleven tags once shipped while the repository advertised a
  # version from the month before, and a later release was tagged and never
  # published — so `uvx`, which is how .claude-plugin/plugin.json starts the
  # server, kept installing the previous version while testing through MCP
  # reported the fixes as not working. Its own job because it needs the tags
  # and the network, and neither belongs in the matrix above.
  version-sync:
    name: Version sync (repo, tags, PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the whole point: a shallow checkout has none, and the
          # check would pass by seeing nothing.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository, tags and PyPI must agree
        run: python scripts/check_version_sync.py --pypi
