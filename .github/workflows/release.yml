name: Release to PyPI

# Publishes the built sdist + wheel to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret is stored in
# this repository. One-time setup on PyPI (Account -> Publishing -> add a
# pending publisher) with exactly these values:
#   PyPI Project Name:  report-workflow
#   Owner:              0Smallcat0
#   Repository name:    report-workflow
#   Workflow name:      release.yml
#   Environment name:   pypi
# After that, every `git tag vX.Y.Z && git push origin vX.Y.Z` publishes
# that version. The build is gated on the same checks CI runs, so a tag that
# would fail the suite never reaches PyPI.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Verify tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[mcp]

      - name: Tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import report_workflow; print(report_workflow.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match report_workflow.__version__ $pkg" >&2
            exit 1
          fi

      - name: Deterministic evidence checks
        run: |
          python scripts/run_report_benchmarks.py --check
          python scripts/run_adversarial_benchmark.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests

  build:
    name: Build distributions
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
