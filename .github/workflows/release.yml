name: Release to PyPI

# Publishes the built sdist + wheel to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret is stored in
# this repository. One-time setup on PyPI (Account -> Publishing -> add a
# pending publisher) with exactly these values:
#   PyPI Project Name:  report-workflow
#   Owner:              0Smallcat0
#   Repository name:    report-workflow
#   Workflow name:      release.yml
#   Environment name:   pypi
# After that, every `git tag vX.Y.Z && git push origin vX.Y.Z` publishes
# that version. The build is gated on the same checks CI runs, so a tag that
# would fail the suite never reaches PyPI.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Verify tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[mcp]

      - name: Tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import report_workflow; print(report_workflow.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match report_workflow.__version__ $pkg" >&2
            exit 1
          fi

      - name: Every version string in the tree must agree
        run: python scripts/check_version_sync.py

      - name: Deterministic evidence checks
        run: |
          python scripts/run_report_benchmarks.py --check
          python scripts/run_adversarial_benchmark.py --check
          python scripts/run_report_quality_benchmark.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests

  build:
    name: Build distributions
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  # Eleven tags shipped to PyPI while the repository's Releases sidebar still
  # said v4.1.0, last month. A visitor reads that as abandoned, and pushing a
  # tag does not create a release on its own -- so it is created here, from the
  # section CHANGELOG.md already carries for that version.
  github_release:
    name: Cut the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          python - "$version" <<'PY' > release_notes.md
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## {re.escape(version)} - \d{{4}}-\d{{2}}-\d{{2}}\n(.*?)(?=^## |\Z)",
              text, re.M | re.S,
          )
          if not match:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            --verify-tag
