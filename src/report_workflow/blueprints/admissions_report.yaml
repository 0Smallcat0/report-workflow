name: admissions_report
description: Admissions-facing report profile

# ICMJE-compliant front matter (ICMJE = International Committee of Medical Journal Editors)
# These fields are required for academic publication submission
front_matter:
  title: ""                    # Required: Full title (Nature recommends 20 chars or fewer, verb-first style)
  short_title: ""              # Optional: Running title for page headers
  author_block: ""             # Required: "Author Name, Author Affiliation" (one per line for multiple)
  affiliation_block: ""        # Required: "Department, Institution, City, Country"
  correspondence: ""          # Required: "Correspondence: author@institution.edu"
  keywords: []                 # Required: 4-6 keywords (ICMJE recommendation)
  acknowledgements: ""         # Optional: Funding, institutional acknowledgements
  funding: ""                  # Optional: Funding body and grant numbers
  conflict_note: ""            # Optional: "The authors declare no conflict of interest."

# Supplementary materials are REQUIRED for academic reports.
# Include: verification_summary, schema_specifications, compilation_trace, extended methods.
supplementary:
  required: true

# Thesis/contribution framing required before drafting
thesis:
  required: true
  placement: introduction_final_paragraph  # Thesis appears in last paragraph of Introduction

section_order:
  - abstract
  - introduction
  - research_scope
  - methods
  - results
  - discussion
  - limitations
  - conclusion
  - references
sections:
  abstract:
    section_id: abstract
    title: Abstract
    title_zh: 摘要
    required: true
    section_type: abstract
    order: 1
    # Contract: abstract must have these subsections (checked by ABSTRACT_CHECK)
    required_subsections:
      - background
      - objective
      - methods
      - principal findings
      - significance
    word_count_min: 180
    word_count_max: 220
  introduction:
    section_id: introduction
    title: Introduction
    title_zh: 緒論
    required: true
    section_type: introduction
    order: 2
  research_scope:
    section_id: research_scope
    title: Research Scope and Design Framing
    title_zh: 研究範疇與設計
    required: true
    section_type: scope
    order: 3
  methods:
    section_id: methods
    title: Methods
    title_zh: 研究方法
    required: true
    section_type: methods
    order: 4
    # Contract: methods must describe procedure, not findings
    tense: past
    voice: passive_or_past_first_person
  results:
    section_id: results
    title: Results
    title_zh: 結果
    required: true
    section_type: results
    order: 5
    # results_mode controls what kinds of claims are allowed:
    # "empirical"        -> actual measured results (performance numbers, experiments)
    # "architectural_characterization" -> system description, no performance claims
    # Default: architectural_characterization (for code/architecture analysis papers)
    # Override to "empirical" for experimental papers with performance data
    results_mode: architectural_characterization
    results_mode_options:
      - empirical
      - architectural_characterization
  discussion:
    section_id: discussion
    title: Discussion
    title_zh: 討論
    required: true
    section_type: discussion
    order: 6
  limitations:
    section_id: limitations
    title: Limitations
    title_zh: 研究限制
    required: true
    section_type: limitations
    order: 7
  conclusion:
    section_id: conclusion
    title: Conclusion
    title_zh: 結論
    required: true
    section_type: conclusion
    order: 8
  references:
    section_id: references
    title: References
    title_zh: 參考文獻
    required: true
    section_type: references
    order: 9
