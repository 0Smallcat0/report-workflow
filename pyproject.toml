[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-workflow"
version = "4.0.0"
description = "Deterministic source-to-report pipeline with evidence-backed DOCX generation, external research, and NotebookLM integration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.0",
  "python-docx>=1.0.0",
  "filetype>=1.2.0",
  "pdfplumber>=0.10.0",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
notebook = ["notebooklm-py>=0.1.0"]
mcp = ["mcp>=1.2"]

[project.scripts]
report-workflow = "report_workflow.cli:main"
report-workflow-mcp = "report_workflow.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
include-package-data = true

[tool.setuptools.package-data]
report_workflow = [
  "blueprints/*.yaml",
  "configs/*.json",
  "configs/style_profiles/*.json",
  "guidelines/*.json",
  "templates/*.docx",
  "templates/*.md",
  "prompts/*.py",
]
