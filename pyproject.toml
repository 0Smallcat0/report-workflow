[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-workflow"
version = "0.1.0"
description = "Local MVP source-to-report workflow with evidence-bound drafting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "python-docx>=1.0.0",
  "filetype>=1.2.0",
  "pdfplumber>=0.10.0",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "Pillow>=9.0",
]

[project.scripts]
report-workflow = "report_workflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
include-package-data = true

[tool.setuptools.package-data]
report_workflow = [
  "blueprints/*.yaml",
  "configs/*.json",
  "configs/style_profiles/*.json",
  "guidelines/*.json",
]
