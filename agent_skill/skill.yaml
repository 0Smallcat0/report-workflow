name: report_workflow
description: A source-to-report automated pipeline that parses sources, requires agent drafting, and renders a final DOCX report.
tools:
  - name: start_report_task
    description: Parses source files and generates task briefs (Markdown) for the agent to draft a structured report. Returns a job_id.
    entrypoint: agent_wrapper.py:start_report_task
    parameters:
      - name: prompt
        type: string
        description: The user request for the report.
      - name: source_files
        type: array
        items: string
        description: List of absolute paths to source files to analyze.
      - name: output_dir
        type: string
        description: Directory path where the final DOCX will be saved.
      - name: report_family
        type: string
        description: Optional override for report family (e.g., 'academic_report', 'work_report').
  - name: submit_and_publish_report
    description: Validates the artifacts generated by the agent and renders the final DOCX. Call this ONLY after creating all requested JSON and Markdown artifacts.
    entrypoint: agent_wrapper.py:submit_and_publish_report
    parameters:
      - name: job_id
        type: string
        description: The job ID returned by start_report_task.
instructions: agent_instructions.md
